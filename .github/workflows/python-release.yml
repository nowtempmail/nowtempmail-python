name: Python SDK Release

# Runs in the PUBLIC mirror repo (nowtempmail/nowtempmail-python), triggered by
# the tag that tools/publish-mirror.mjs pushes there.
#
# It lives at python-package/.github/workflows/ in the private monorepo, NOT at
# the monorepo root. `git archive HEAD:python-package` carries this directory
# and nothing outside it, so a release workflow at the root would never reach
# the mirror -- and the PyPI trusted publisher, which names this repository and
# this exact filename, would have no workflow to match. That failure is silent:
# the tag pushes, nothing runs, and no release appears.
#
# The filename is `python-release.yml` rather than the `release.yml` its npm
# counterpart uses, because the trusted publishers on PyPI and TestPyPI already
# name it. Renaming means re-editing four publisher configurations by hand for
# no functional gain.
#
# ## Credentials: there are none
#
# Publishing uses PyPI Trusted Publishing (OIDC). No PYPI_API_TOKEN in repo
# secrets, nothing to rotate, nothing to forget.
#
# That is a deliberate lesson from vscode-release.yml, which carries the
# opposite one in its own comments: VSCE_PAT expires, the job starts failing
# with a 401 a year later, and nobody remembers why. An OIDC exchange has no
# expiry to forget.
#
# Configure it once per distribution on pypi.org, scoped to this repository and
# the `pypi` environment named below. Both `nowtempmail` and
# `pytest-nowtempmail` need their own trusted publisher.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only -- publish to neither index"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Detected version=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with pyproject.toml produces a release whose
      # filename, tag and PyPI version are three different numbers. PyPI
      # versions are immutable, so this is cheaper to catch than to undo.
      - name: Verify the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine pytest pytest-xdist

      - name: Test
        run: |
          python -m pip install -e .
          python -m pytest -q

      - name: Build both distributions
        run: |
          python -m build --outdir dist .
          python -m build --outdir dist plugin

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    name: TestPyPI, then install from it
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    environment: testpypi
    permissions:
      id-token: write # the OIDC exchange
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The hop that earns its place. A broken pyproject.toml -- a missing
      # package directory, a bad entry point, a dependency that does not resolve
      # -- passes every check above and only fails when something tries to
      # install it. Finding that out on TestPyPI costs nothing; finding it out
      # on PyPI burns a version number that can never be reused.
      - name: Install from TestPyPI into a clean venv and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          # --extra-index-url so the real PyPI supplies pytest and friends;
          # TestPyPI carries only what we just pushed there.
          /tmp/smoke/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "pytest-nowtempmail==${{ needs.build.outputs.version }}"
          # Pinned to the exact version deliberately: an unpinned install could
          # resolve to a previously published release and pass while proving
          # nothing about the artifact this run built.
          /tmp/smoke/bin/python -c "import nowtempmail; print(nowtempmail.__version__)"

          # The pytest11 entry point is the entire reason the shim distribution
          # exists, and `import nowtempmail` above does not test it: the shim
          # could ship with no entry point at all and that import would still
          # succeed, because the module comes from the SDK.
          #
          # Asserted against installed metadata rather than pytest's CLI. The
          # first version of this check ran
          # `pytest --version --trace-config | grep -q nowtempmail`, which fails
          # on a perfectly good package: `--version` makes pytest print the
          # version and exit BEFORE emitting any plugin trace, so the grep
          # matched nothing. It failed the 0.1.0 release after every real check
          # had passed.
          /tmp/smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          found = [e for e in entry_points(group="pytest11") if e.name == "nowtempmail"]
          if not found:
              raise SystemExit(
                  "pytest-nowtempmail is installed but registers no pytest11 entry "
                  "point -- the shim's metadata is wrong and the fixtures would be "
                  "invisible to pytest."
              )
          module = found[0].load()
          for fixture in ("ntm_inbox", "ntm_fresh_inbox", "ntm_client"):
              if not hasattr(module, fixture):
                  raise SystemExit(f"plugin loaded but {fixture} is missing")
          print(f"pytest11 entry point ok: {found[0].value}")
          PY

  pypi:
    name: PyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # This step uploads TWO distributions in one call, and PyPI processes
          # them one at a time. If the second fails -- a missing trusted
          # publisher for it, most likely -- the first is already published and
          # cannot be unpublished. Without this, every retry then dies on the
          # duplicate file rather than on the thing that actually broke, and the
          # only way forward is to burn a version number.
          #
          # That is not hypothetical: it is exactly what happened between 0.1.1
          # and 0.1.2. TestPyPI had this from the start; PyPI did not, and the
          # asymmetry cost a release.
          #
          # It does not weaken the "did you forget to bump?" guard -- the step
          # above already refuses to run when the tag and pyproject.toml
          # disagree, so a version can only be published under its own tag.
          skip-existing: true
